services:
  - type: web
    name: sudoku-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: EULERSTREAM_SIGN_API_KEY
        sync: false
      # Optional: set to "true" in Render's dashboard only while diagnosing
      # a chat-parsing issue. Leave unset for normal live use - see
      # CHANGES.md for why.
      - key: CHAT_DEBUG_LOG
        value: "false"
